{% extends 'base.html' %}
{% load static %}

{% block title %}
Verification Success
{% endblock %}

{% block content %}

<link rel="stylesheet" href="{% static 'accounts/css/verification_success.css' %}">
<link rel="stylesheet" href="{% static 'accounts/css/global-messages.css' %}">

<meta http-equiv="refresh" content="4;url=/signin/">

<div class="success-page">

    <div class="success-left">

        <video
            autoplay
            muted
            loop
            playsinline
            class="success-video"
        >

            <source
                src="{% static 'accounts/videos/signup-verifyemail.mp4' %}"
                type="video/mp4"
            >

        </video>

        <div class="success-overlay"></div>

    </div>

    <div class="mobile-logo">

        <img
            src="{% static 'accounts/images/neolearn-logo.png' %}"
            alt="NeoLearn"
        >

    </div>

    <div class="success-right">

        <div class="success-card">

            <div class="top-dot"></div>

            <div class="success-circle">

                <div class="success-check">

                    ✓

                </div>

            </div>

            <h1>

                Verification Successful

            </h1>

            <p>

                Your account has been verified successfully.
                Redirecting you to Sign In page.

            </p>

            <div class="redirect-status">

                Redirecting in

                <span id="redirect-timer">

                    4

                </span>

                s

            </div>

            <div class="loader">

                <div class="loader-bar"></div>

            </div>

        </div>

    </div>

</div>

<script>

    let seconds = 4

    const timer = document.getElementById("redirect-timer")

    const countdown = setInterval(()=>{

        seconds--

        timer.innerText = seconds

        if(seconds <= 0){

            clearInterval(countdown)

        }

    },1000)

</script>

{% endblock %}
