{% load static %}

<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>

        NeoLearn LMS

    </title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>


<body
    class="
        min-h-screen

        bg-[#020617]

        overflow-hidden

        relative

        flex
        items-center
        justify-center
    "
>


    <!-- BACKGROUND GLOW -->

    <div
        class="
            absolute
            top-[-200px]
            left-[-200px]

            w-[500px]
            h-[500px]

            bg-cyan-400/10

            rounded-full

            blur-[140px]
        "
    ></div>


    <div
        class="
            absolute
            bottom-[-200px]
            right-[-200px]

            w-[500px]
            h-[500px]

            bg-blue-500/10

            rounded-full

            blur-[140px]
        "
    ></div>



    <!-- CONTENT -->

    <div
        class="
            relative
            z-10

            text-center

            px-6
        "
    >

        <!-- LOGO -->

        <h1
            class="
                text-white

                text-[60px]
                md:text-[80px]

                font-black
                tracking-tight
            "
        >

            Neo<span class="text-cyan-400">Learn</span>

        </h1>


        <!-- SUBTITLE -->

        <p
            class="
                text-[#94A3B8]

                text-[18px]
                md:text-[22px]

                mt-5

                max-w-[700px]
            "
        >

            Modern AI-powered learning platform for students,
            developers, and future innovators.

        </p>



        <!-- BUTTONS -->

        <div
            class="
                mt-10

                flex
                flex-col
                sm:flex-row

                items-center
                justify-center

                gap-4
            "
        >

            <!-- GET STARTED -->

            <a
                href="{% url 'signup' %}"

                class="
                    px-8
                    py-4

                    rounded-[18px]

                    bg-cyan-400

                    text-[#020617]

                    text-[16px]
                    font-bold

                    shadow-[0_0_35px_rgba(0,255,255,0.35)]

                    hover:scale-[1.03]

                    transition-all
                "
            >

                Get Started

            </a>



            <!-- SIGN IN -->

            <a
                href="{% url 'signin' %}"

                class="
                    px-8
                    py-4

                    rounded-[18px]

                    border
                    border-white/10

                    bg-white/5

                    text-white

                    text-[16px]
                    font-semibold

                    hover:bg-white/10

                    transition-all
                "
            >

                Sign In

            </a>

        </div>

    </div>

</body>

</html>
